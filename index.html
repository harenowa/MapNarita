<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title data-i18n="app.title">成田市バリアフリー・生活支援マップ</title>
  <meta name="description" content="車椅子、ベビーカー、高齢者、乳幼児連れの皆様のための成田市特化型バリアフリーマップアプリ" />
</head>
<body>
  <div id="app">
    <!-- Header -->
    <header class="app-header">
      <div class="brand">
        <div class="brand-icon">♿</div>
        <div class="brand-title" data-i18n="app.title">成田市バリアフリーマップ</div>
      </div>
      <div class="header-controls">
        <button id="loc-btn" class="btn-icon" data-i18n-title="app.currentLocation" title="現在地">📍</button>
        <button id="lang-btn" class="btn-icon" data-i18n-title="app.language" title="Language">🌐</button>
        <button id="theme-btn" class="btn-icon" data-i18n-title="app.theme" title="Theme">🌙</button>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-container">
      <!-- Leaflet Map -->
      <div id="map"></div>

      <!-- Floating Sidebar / 3-Stage Mobile Bottom Sheet -->
      <aside id="sidebar" class="sidebar state-half">
        <!-- ドラッグバー (スマホ) -->
        <div id="sheet-drag-handle" class="sheet-handle">
          <div class="handle-bar"></div>
        </div>

        <div class="search-box">
          <div class="search-input-wrapper">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="text" id="search-input" class="search-input" data-i18n-placeholder="app.searchPlaceholder" placeholder="施設名・住所で検索..." />
          </div>

          <div style="display: flex; gap: 8px;">
            <!-- ボトムシート拡大/最小化切替ボタン -->
            <button id="sheet-toggle-btn" class="sheet-toggle-btn" style="flex: 1;">
              <span id="sheet-toggle-text">▲ 全画面拡大</span>
            </button>
            <!-- フィルター開閉ボタン -->
            <button id="toggle-filter-btn" class="toggle-filter-btn" style="flex: 1;">
              <span id="toggle-filter-text">▼ 絞り込みフィルタ</span>
            </button>
          </div>
        </div>

        <div id="filter-section" class="filter-section">
          <div class="section-title" data-i18n="app.categories">カテゴリ</div>
          <div id="category-grid" class="category-grid"></div>

          <div class="section-title" style="margin-top: 14px;" data-i18n="app.accessibility">バリアフリー設備</div>
          <div id="attr-list" class="attr-list"></div>

          <div style="margin-top: 10px;">
            <label class="attr-item">
              <input type="checkbox" id="open-now-check" />
              <span data-i18n="app.openNow">現在営業中のみ</span>
            </label>
          </div>
        </div>

        <div style="padding: 10px 16px 0; font-size: 0.78rem; color: var(--text-muted); font-weight: 600;" id="results-count"></div>
        <div id="results-list" class="results-list"></div>
      </aside>

      <!-- Facility Detail Panel -->
      <div id="detail-panel" class="detail-panel"></div>

      <!-- User Report Modal -->
      <div id="report-modal" style="display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 1500; align-items: center; justify-content: center; backdrop-filter: blur(4px);"></div>

      <!-- FAB (Report button) -->
      <button id="fab-report-btn" class="fab-report">
        <span>➕</span>
        <span data-i18n="app.reportButton">情報を投稿</span>
      </button>
    </main>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
